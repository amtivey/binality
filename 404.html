<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found • Binality</title>
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #070314;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .card {
      max-width: 460px;
      width: 100%;
      padding: 36px 32px;
      border-radius: 28px;
      background: rgba(18, 11, 42, 0.8);
      border: 1px solid rgba(255, 112, 217, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(236, 72, 153, 0.14);
      border: 1px solid rgba(236, 72, 153, 0.35);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #ff70d9;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
    }
    p {
      margin: 0 0 24px;
      font-size: 0.92rem;
      line-height: 1.6;
      color: #cbd5e1;
    }
    a.btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ec4899 0%, #9333ea 100%);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 8px 24px -4px rgba(236, 72, 153, 0.45);
    }
    a.btn:hover {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">ERROR 404</span>
    <h1>Page Not Found</h1>
    <p>Sorry, the page or frequency preset you were trying to view does not exist.</p>
    <a class="btn" href="index.html">Return to Binality</a>
  </div>
</body>
</html>
