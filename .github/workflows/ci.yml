name: CI

# Static-site baseline checks. There is no build step: the site is served
# as-is. Node 22 is required by Capacitor 8 (native layer, added separately).
on:
  push:
    branches: [main, dev, "rollback/**", "ci/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check site
        run: bash scripts/ci-check.sh
